<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <title>Product Name — Concise Value Proposition</title>
    <meta name="description" content="Clear product summary under 160 characters." />
    <link rel="canonical" href="https://example.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:site_name" content="Product Name" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Product Name — Concise Value Proposition" />
    <meta property="og:description" content="Clear product summary under 160 characters." />
    <meta property="og:image" content="https://example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Product preview" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Product Name — Concise Value Proposition" />
    <meta name="twitter:description" content="Clear product summary under 160 characters." />
    <meta name="twitter:image" content="https://example.com/og-image.png" />

    <!-- Pre-paint theme initialization to prevent FOUC -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const dark = stored === "dark" || (!stored && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
  </head>
  <body class="min-h-dvh bg-bg-default text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
