name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: Optional semver bump before releasing
        required: false
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  gate:
    name: Check if release is needed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate release trigger
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BUMP_KIND: ${{ inputs.bump }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${BUMP_KIND:-none}" != "none" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$REF_NAME" == refs/tags/v* ]] || ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG already exists on $GITHUB_REPOSITORY; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify release payload
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check bash, jq, and JS syntax
        run: |
          bash -n skills/react-design-system/scripts/audit-react-ds.sh
          node --check skills/react-design-system/assets/templates/visual-qa-probe.js
          jq --version
      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          EXPECTED="v$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ($EXPECTED)" >&2
            exit 1
          fi

  publish:
    name: Build and publish GitHub Release
    needs: [gate, verify]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && needs.gate.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional semver bump on manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          BUMP_KIND: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          bump = os.environ["BUMP_KIND"]
          ver = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          major, minor, patch = (int(x) for x in ver.split("."))
          if bump == "major":
              next_ver = f"{major + 1}.0.0"
          elif bump == "minor":
              next_ver = f"{major}.{minor + 1}.0"
          else:
              next_ver = f"{major}.{minor}.{patch + 1}"
          pathlib.Path("VERSION").write_text(next_ver + "\n", encoding="utf-8")
          for manifest in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              p = pathlib.Path(manifest)
              data = json.loads(p.read_text(encoding="utf-8"))
              if "version" in data:
                  data["version"] = next_ver
              if "plugins" in data and data["plugins"]:
                  data["plugins"][0]["version"] = next_ver
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"Bumped {ver} -> {next_ver}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEXT_VER="$(tr -d '[:space:]' < VERSION)"
          git add VERSION .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore(release): bump version to v${NEXT_VER}"
          git push origin HEAD:main

      - name: Build deterministic release archive and manifest
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib, json, os, pathlib, stat, subprocess, zipfile

          repo = pathlib.Path(".").resolve()
          version = (repo / "VERSION").read_text(encoding="utf-8").strip()
          tag = f"v{version}"
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          out = repo / "dist" / "release"
          out.mkdir(parents=True, exist_ok=True)
          skill_dir = repo / "skills" / "react-design-system"
          entries = []
          for dirpath, dirnames, filenames in os.walk(skill_dir, followlinks=False):
              parent = pathlib.Path(dirpath)
              dirnames[:] = sorted(d for d in dirnames if d not in {".git", "__pycache__", ".pytest_cache"})
              for fname in sorted(filenames):
                  if fname == ".DS_Store":
                      continue
                  p = parent / fname
                  st = p.lstat()
                  if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode):
                      raise SystemExit(f"Unsupported file: {p}")
                  rel = p.relative_to(skill_dir).as_posix()
                  entries.append((f"react-design-system/{rel}", p.read_bytes(), bool(st.st_mode & 0o111)))
          entries.sort(key=lambda item: item[0])
          zip_path = out / "react-design-system.zip"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_STORED) as zf:
              for member, raw, is_exec in entries:
                  info = zipfile.ZipInfo(member, (1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = (stat.S_IFREG | (0o755 if is_exec else 0o644)) << 16
                  info.compress_type = zipfile.ZIP_STORED
                  zf.writestr(info, raw)
          raw_zip = zip_path.read_bytes()
          zip_sha = hashlib.sha256(raw_zip).hexdigest()
          manifest = {
              "schema_version": "react-design-system-release-manifest.v1",
              "repository": "remorser58/react-design-system-skill",
              "version": version,
              "tag": tag,
              "commit": commit,
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": {
                  "react-design-system": {
                      "filename": zip_path.name,
                      "sha256": zip_sha,
                      "bytes": len(raw_zip),
                      "file_count": len(entries),
                      "top_directory": "react-design-system",
                  }
              },
          }
          manifest_path = out / "release-manifest.json"
          manifest_path.write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          m_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          (out / "SHA256SUMS.txt").write_text(
              f"{zip_sha}  {zip_path.name}\n{m_sha}  {manifest_path.name}\n",
              encoding="utf-8",
          )
          print(f"Built {tag} assets ({len(entries)} files)")
          PY
          (cd dist/release && sha256sum -c SHA256SUMS.txt)
          echo "RELEASE_TAG=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Publish GitHub Release if tag not already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/release/react-design-system.zip \
            dist/release/release-manifest.json \
            dist/release/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD)" \
            --title "React Design System Skill $RELEASE_TAG" \
            --generate-notes \
            --latest
          echo "Published $RELEASE_TAG with verified assets." >> "$GITHUB_STEP_SUMMARY"
